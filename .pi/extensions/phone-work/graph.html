<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>learn · map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root { --bg:#f6f5f2; --fg:#1d1d1f; --muted:#6e6e73; --card:#fff; --line:#e3e1dc; --accent:#2f6fde; --soft:#eef2fb; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#141416; --fg:#f2f2f4; --muted:#9a9aa1; --card:#1f1f23; --line:#2e2e34; --accent:#5b8ff0; --soft:#242838; color-scheme: dark; } }
* { box-sizing:border-box; } html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, system-ui, sans-serif; display:grid; grid-template-rows:auto 1fr; }
header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--card); flex-wrap:wrap; }
header h1 { font-size:16px; margin:0; font-weight:700; }
header a { color:var(--accent); text-decoration:none; font-weight:600; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.seg button { border:0; background:var(--card); color:var(--fg); padding:6px 12px; font:inherit; font-weight:600; cursor:pointer; }
.seg button.on { background:var(--accent); color:#fff; }
label.k { font-size:13px; color:var(--muted); display:inline-flex; align-items:center; gap:6px; }
input[type=range] { accent-color:var(--accent); }
main { display:grid; grid-template-columns: minmax(0,1fr) 360px; min-height:0; }
@media (max-width: 900px) { main { grid-template-columns:1fr; grid-template-rows: 1fr auto; } aside { max-height:40vh; } }
#wrap { position:relative; min-height:0; }
canvas { display:block; width:100%; height:100%; touch-action:none; background:var(--bg); }
aside { border-left:1px solid var(--line); background:var(--card); overflow:auto; padding:14px 16px; }
aside h2 { font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:14px 0 6px; } aside h2:first-child { margin-top:0; }
aside p { margin:0 0 8px; } aside li { margin:0 0 6px; }
.legend { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); }
.bar { width:120px; height:10px; border-radius:5px; }
#tip { position:absolute; pointer-events:none; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; box-shadow:0 4px 16px rgba(0,0,0,.15); display:none; max-width:280px; }
#detail { border-top:1px solid var(--line); margin-top:12px; padding-top:10px; font-size:14px; }
#detail .m { color:var(--muted); font-size:13px; }
.small { font-size:12px; color:var(--muted); }
</style></head>
<body>
<header>
  <h1>Knowledge map</h1>
  <a id="back" href="#">← lesson</a>
  <span class="seg"><button id="byTime" class="on">Time since learned</button><button id="byFreq">How often learned</button></span>
  <label class="k">neighbour falloff <input id="fall" type="range" min="0" max="80" value="35"><span id="fallv">35%</span></label>
  <label class="k"><input id="showPlan" type="checkbox" checked> lesson steps</label>
  <label class="k"><input id="labels" type="checkbox" checked> labels</label>
  <span class="legend"><span id="legL">today</span><span id="bar" class="bar"></span><span id="legR">months ago / never</span></span>
</header>
<main>
  <div id="wrap"><canvas id="c"></canvas><div id="tip"></div></div>
  <aside>
    <div id="summary"><p class="small">Loading…</p></div>
    <div id="detail" class="small">Hover a node for details; click to pin. Drag to move, scroll or pinch to zoom.</div>
  </aside>
</main>
<script>
const token = new URLSearchParams(location.search).get("t");
const api = (p) => p + (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(token);
document.getElementById("back").href = "/?t=" + encodeURIComponent(token);
const $ = (id) => document.getElementById(id);
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
let mode = "time", falloff = 0.35, showPlan = true, showLabels = true;
let data = null, sim = null, nodes = [], links = [], transform = d3.zoomIdentity, hover = null, pinned = null;
const canvas = $("c"), ctx = canvas.getContext("2d"); let W = 0, H = 0, dpr = Math.max(1, devicePixelRatio || 1);
// color scale: hot (recent / frequent) -> cold (old / rare / never)
const hot = d3.interpolateRgb(dark ? "#2a2a33" : "#d9d7d1", "#ff7a1a");
$("bar").style.background = "linear-gradient(90deg, #ff7a1a, " + (dark ? "#2a2a33" : "#d9d7d1") + ")";
const TYPE = { goal: { r: 14, stroke: "#5b8ff0" }, milestone: { r: 8, stroke: "#8a8a92" }, concept: { r: 7, stroke: "#6ab07f" }, plan: { r: 3.5, stroke: "#b8b8c0" } };

function ownValue(n) {
  if (mode === "time") { if (!n.last) return 0; const days = (Date.now() - new Date(n.last).getTime()) / 86400000; return Math.exp(-days / 10); }
  const c = n.count || 0; return c ? Math.min(1, Math.log1p(c) / Math.log1p(12)) : 0;
}
function computeHeat() {
  const own = new Map(nodes.map((n) => [n.id, ownValue(n)]));
  const adj = new Map(nodes.map((n) => [n.id, []]));
  for (const l of links) { const a = typeof l.source === "object" ? l.source.id : l.source, b = typeof l.target === "object" ? l.target.id : l.target; if (adj.has(a) && adj.has(b)) { adj.get(a).push(b); adj.get(b).push(a); } }
  // one and two hops with steep falloff: f and f^2 (f = falloff)
  for (const n of nodes) {
    let v = own.get(n.id) || 0;
    for (const nb of adj.get(n.id) || []) { v = Math.max(v, (own.get(nb) || 0) * falloff); for (const nb2 of adj.get(nb) || []) v = Math.max(v, (own.get(nb2) || 0) * falloff * falloff); }
    n.heat = v;
  }
}
function fitCanvas() { const r = canvas.parentElement.getBoundingClientRect(); W = r.width; H = r.height; canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); canvas.style.width = W + "px"; canvas.style.height = H + "px"; draw(); }
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.translate(transform.x, transform.y); ctx.scale(transform.k, transform.k);
  ctx.lineWidth = 1 / transform.k; ctx.strokeStyle = dark ? "rgba(255,255,255,0.12)" : "rgba(0,0,0,0.12)";
  for (const l of links) { if (!showPlan && (l.source.type === "plan" || l.target.type === "plan")) continue; ctx.beginPath(); ctx.moveTo(l.source.x, l.source.y); ctx.lineTo(l.target.x, l.target.y); ctx.stroke(); }
  for (const n of nodes) {
    if (!showPlan && n.type === "plan") continue;
    const t = TYPE[n.type]; const r = t.r * (n.type === "concept" ? 1 + Math.min(1, (n.count || 0) / 10) * 0.6 : 1);
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fillStyle = hot(n.heat || 0); ctx.fill();
    ctx.lineWidth = (n === hover || n === pinned ? 3 : 1.2) / transform.k; ctx.strokeStyle = n === hover || n === pinned ? "#ffffff" : t.stroke; ctx.stroke();
    if (n.status === "done" || n.status === "solid" || n.status === "confirmed") { ctx.beginPath(); ctx.arc(n.x, n.y, r * 0.35, 0, Math.PI * 2); ctx.fillStyle = dark ? "#fff" : "#222"; ctx.fill(); }
  }
  if (showLabels && transform.k > 0.6) {
    ctx.fillStyle = dark ? "#e6e6ea" : "#2a2a2e"; ctx.textBaseline = "middle";
    for (const n of nodes) { if (!showPlan && n.type === "plan") continue; if (n.type === "plan" && transform.k < 1.6) continue; if (n.type === "milestone" && transform.k < 0.9) continue; ctx.font = (n.type === "goal" ? "bold 13px" : n.type === "plan" ? "10px" : "11px") + " system-ui"; ctx.fillText(n.label.length > 42 ? n.label.slice(0, 41) + "…" : n.label, n.x + TYPE[n.type].r + 4, n.y); }
  }
}
function nodeAt(px, py) { const [x, y] = transform.invert([px, py]); let best = null, bd = Infinity; for (const n of nodes) { if (!showPlan && n.type === "plan") continue; const d = Math.hypot(n.x - x, n.y - y); const r = TYPE[n.type].r + 6 / transform.k; if (d < r && d < bd) { best = n; bd = d; } } return best; }
function describe(n) {
  const days = n.last ? Math.round((Date.now() - new Date(n.last).getTime()) / 86400000) : null;
  const when = n.last ? (days === 0 ? "today" : days === 1 ? "yesterday" : days + " days ago") : "never";
  return '<b>' + n.label + '</b><div class="m">' + n.type + (n.status ? " · " + n.status : "") + " · last " + when + " · " + (n.count || 0) + " times</div>" + (n.url ? '<div class="m">' + n.url + "</div>" : "");
}
function showDetail(n) { $("detail").innerHTML = n ? describe(n) : '<span class="small">Hover a node for details; click to pin.</span>'; }
async function load() {
  const r = await fetch(api("/graph.json"), { cache: "no-store" }); data = await r.json();
  $("summary").innerHTML = window.marked ? marked.parse(data.summary || "") : "<pre>" + (data.summary || "") + "</pre>";
  nodes = data.nodes.map((n) => ({ ...n })); const idx = new Map(nodes.map((n) => [n.id, n]));
  links = data.links.filter((l) => idx.has(l.source) && idx.has(l.target)).map((l) => ({ ...l }));
  computeHeat();
  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance((l) => (l.kind === "step" ? 22 : l.kind === "teaches" ? 30 : l.kind === "has" ? 60 : 45)).strength((l) => (l.kind === "step" ? 0.9 : 0.5)))
    .force("charge", d3.forceManyBody().strength((d) => (d.type === "goal" ? -260 : d.type === "plan" ? -25 : -90)))
    .force("center", d3.forceCenter(W / 2, H / 2))
    .force("collide", d3.forceCollide((d) => TYPE[d.type].r + 3))
    .on("tick", draw);
}
fitCanvas(); addEventListener("resize", fitCanvas); load();
// interaction: zoom/pan + drag
const zoom = d3.zoom().scaleExtent([0.25, 6]).on("zoom", (e) => { transform = e.transform; draw(); });
d3.select(canvas).call(zoom).on("dblclick.zoom", null);
d3.select(canvas).call(d3.drag().container(canvas).subject((e) => { const n = nodeAt(e.x, e.y); if (n) { n.fx = n.x; n.fy = n.y; } return n; })
  .on("start", (e) => { if (!e.active) sim.alphaTarget(0.3).restart(); })
  .on("drag", (e) => { const [x, y] = transform.invert([e.x, e.y]); e.subject.fx = x; e.subject.fy = y; })
  .on("end", (e) => { if (!e.active) sim.alphaTarget(0); e.subject.fx = null; e.subject.fy = null; }));
canvas.addEventListener("pointermove", (e) => { const n = nodeAt(e.offsetX, e.offsetY); if (n !== hover) { hover = n; draw(); if (!pinned) showDetail(n); } const tip = $("tip"); if (n) { tip.style.display = "block"; tip.style.left = (e.offsetX + 12) + "px"; tip.style.top = (e.offsetY + 12) + "px"; tip.innerHTML = describe(n); } else tip.style.display = "none"; });
canvas.addEventListener("click", (e) => { const n = nodeAt(e.offsetX, e.offsetY); pinned = n === pinned ? null : n; showDetail(pinned || hover); draw(); });
$("byTime").onclick = () => { mode = "time"; $("byTime").classList.add("on"); $("byFreq").classList.remove("on"); $("legL").textContent = "today"; $("legR").textContent = "months ago / never"; computeHeat(); draw(); };
$("byFreq").onclick = () => { mode = "freq"; $("byFreq").classList.add("on"); $("byTime").classList.remove("on"); $("legL").textContent = "often"; $("legR").textContent = "never"; computeHeat(); draw(); };
$("fall").oninput = () => { falloff = Number($("fall").value) / 100; $("fallv").textContent = $("fall").value + "%"; computeHeat(); draw(); };
$("showPlan").onchange = () => { showPlan = $("showPlan").checked; draw(); };
$("labels").onchange = () => { showLabels = $("labels").checked; draw(); };
setInterval(async () => { try { const r = await fetch(api("/graph.json"), { cache: "no-store" }); const d = await r.json(); if (d.generated !== data.generated) { const pos = new Map(nodes.map((n) => [n.id, [n.x, n.y]])); data = d; $("summary").innerHTML = marked.parse(d.summary || ""); nodes = d.nodes.map((n) => { const p = pos.get(n.id); return p ? { ...n, x: p[0], y: p[1] } : { ...n }; }); const idx = new Map(nodes.map((n) => [n.id, n])); links = d.links.filter((l) => idx.has(l.source) && idx.has(l.target)).map((l) => ({ ...l })); computeHeat(); sim.nodes(nodes); sim.force("link").links(links); sim.alpha(0.3).restart(); } } catch {} }, 15000);
</script>
</body></html>
